# Permanent app identity: appId is also the Windows AppUserModelID (src/main/buildConfig.ts APP_ID).
# Never change it after the first public release.
appId: app.mailroom
productName: Mailroom
executableName: Mailroom
copyright: Copyright (c) 2026 voyd
directories:
  output: release
  buildResources: build
# Smaller package (measured with `electron-builder --dir`):
# - better-sqlite3 ships its C source, node-gyp files and a prebuilt binary for every platform;
#   only the Windows x64 binary is needed.
# - No type files, source maps, docs or tests from node_modules (electron-builder already drops
#   README/CHANGELOG/test folders; licenses are kept on purpose).
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/better-sqlite3/lib/{darwin,linux,linuxmusl,win32-arm64}*.js'
  - '!node_modules/node-addon-api/**'
  - '!**/node_modules/**/*.{d.ts,d.cts,d.mts,ts.map,markdown,tsbuildinfo}'
  - '!**/node_modules/**/{docs,doc,test,tests,__tests__,example,examples,.github}/**'
  - '!**/node_modules/**/{CHANGELOG,CHANGES,HISTORY,README,readme,Readme}*'
  - '!**/node_modules/**/*.md'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# The prebuilt binary of better-sqlite3 is N-API (works in Electron as it is): no rebuild needed.
npmRebuild: false
# Strongest compression for the installer (slower build, smaller download).
compression: maximum
# The app UI is English only. Chromium's other 50+ language files are not needed.
electronLanguages:
  - en-US
extraResources:
  - from: build/icon.ico
  - from: build/icon.png
# mailto: links. NSIS ignores this key; the Windows registry entries that make Mailroom show up in
# Settings > Default apps are written by build/installer.nsh. Kept for other platforms and as a record.
protocols:
  - name: Mailto
    schemes:
      - mailto
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Mailroom-Setup-${version}.${ext}
nsis:
  include: build/installer.nsh
  # One click: no wizard pages, installs per-user into %LOCALAPPDATA%\Programs and starts the app.
  # Friendlier for non-technical users and needs no admin rights.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Mailroom
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Keep %APPDATA%\Mailroom (accounts, mail, settings) when uninstalling or updating.
  deleteAppDataOnUninstall: false
# Auto-update (ARCHITECTURE section 0, item 7): generic provider on the project website.
# PLACEHOLDER URL: replace with the real website path before the first public release
# No code signing yet (section 0, item 8): to add it later, set
# win.signtoolOptions / azureSignOptions here, no code changes needed.
publish:
  provider: generic
  url: https://example.invalid/mailroom/updates
