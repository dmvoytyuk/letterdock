name: Installer test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win nsis --publish never
      - name: Installer self-test (broken old uninstaller)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -ReleaseDir release
