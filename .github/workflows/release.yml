name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # Never let electron-builder publish by itself; the release step below does it.
      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win nsis --publish never

      # Code signing (later): SignPath Foundation, free for open-source projects.
      # Upload the unsigned installer to SignPath, wait for the signed one, then replace it
      # in release/ BEFORE the upload steps below. Rebuild latest.yml hashes after signing.
      # - name: Sign installer (SignPath)
      #   uses: signpath/github-action-submit-signing-request@<full-commit-sha> # vX.Y
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: mailroom
      #     signing-policy-slug: release-signing
      #     github-artifact-id: <id of the uploaded unsigned artifact>
      #     wait-for-completion: true
      #     output-artifact-directory: release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailroom-windows
          if-no-files-found: error
          path: |
            release/Mailroom-Setup-*.exe
            release/Mailroom-Setup-*.exe.blockmap
            release/latest.yml

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/Mailroom-Setup-*.exe
            release/Mailroom-Setup-*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
